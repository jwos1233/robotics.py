[project]
name = "robotics-constraint-radar"
version = "0.1.0"
description = "Supply-chain constraint radar for the humanoid / mobile-manipulation buildout, plus an equity baskets layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robotics_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:robotics_radar.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are machine-generated; reformatting them obscures the diff
# against what autogenerate would produce.
"alembic/versions/*" = ["E501"]
